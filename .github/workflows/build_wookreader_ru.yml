name: Build WookReader Russian (Large Library Fix)
on:
  push:
    branches: [wookreader-ru-library-fix]
    paths:
      - ".github/workflows/build_wookreader_ru.yml"
      - "wookreader_ru/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout Russian patch
        uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          apt-get update
          apt-get install -y libfreetype6-dev curl unzip
      - name: Clone original WookReader sources
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/exorevan/WookReader.git wookreader-src
      - name: Apply Russian translations and UTF-8 support
        run: |
          python3 wookreader_ru/apply_ru.py wookreader-src
          python3 wookreader_ru/optimize.py wookreader-src
          python3 -m py_compile wookreader_ru/optimize.py
      - name: Identify translated build as 0.7.0-RU
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("wookreader-src/Makefile")
          s = p.read_text(encoding="utf-8")
          s = s.replace("VERSION_MINOR := 6", "VERSION_MINOR := 7")
          s = s.replace("VERSION_MICRO := 7", "VERSION_MICRO := 0")
          s = s.replace("APP_TITLE   := WookReader", "APP_TITLE   := WookReader RU")
          s = s.replace("APP_VERSION := ${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_MICRO}-sigma", "APP_VERSION := 0.7.0-RU2")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Build MuPDF and Switch executable
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export LIBNX=$DEVKITPRO/libnx
          export PORTLIBS=$DEVKITPRO/portlibs/switch
          export PATH=$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH
          cd wookreader-src
          export NODEBUG=true
          make -f Makefile.mupdf -j2
          make -j2
          test -s WookReader.nro
      - name: Create Atmosphere / Homebrew ZIP
        shell: bash
        run: |
          mkdir -p output/switch/WookReader
          cp wookreader-src/WookReader.nro output/switch/WookReader/WookReader.nro
          python3 - <<'PY'
          from pathlib import Path
          Path("output/README_RU.txt").write_text(
              "WOOKREADER RU 0.7.0-RU2 — УЛУЧШЕННАЯ ВЕРСИЯ\n\n"
              "1. Скопируйте папку switch из ZIP в корень SD через DBI.\n"
              "2. Сохраните свои books/, заметки, saved_pages.cfg и options.cfg.\n"
              "3. Старые списки страниц автоматически обновятся при первом открытии.\n"
              "4. Для иконки HOME откройте Sphaira из Homebrew Menu в полном режиме (удерживать R при запуске игры).\n"
              "5. Выберите WookReader RU, нажмите X и выберите Install Forwarder.\n"
              "6. На HOME появится отдельная иконка; NRO должен оставаться по пути /switch/WookReader/WookReader.nro.\n"
              "Если Sphaira нет, скачайте: https://github.com/NaGaa95/sphaira/releases/tag/1.0.8\n\n"
              "Тест компиляции пройден; работа на настоящей Switch подлежит подтверждению.\n",
              encoding="utf-8"
          )
          PY
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path("WookReader_RU_LibraryFix_TEST.zip")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in Path("output").rglob("*"):
                  if p.is_file(): z.write(p,p.relative_to("output").as_posix())
          print("ZIP ready:",out,out.stat().st_size)
          PY
      - name: Bundle official Sphaira 1.0.8 (HOME Menu shortcut tool)
        shell: bash
        run: |
          mkdir -p /tmp/sphaira_package output/switch
          if curl -fLsS --retry 3 -o /tmp/sphaira.zip https://github.com/NaGaa95/sphaira/releases/download/1.0.8/sphaira.zip; then
            unzip -q /tmp/sphaira.zip -d /tmp/sphaira_package
            SFILE="$(find /tmp/sphaira_package -type f -name sphaira.nro -print -quit)"
            if [ -n "$SFILE" ]; then
              cp "$SFILE" output/switch/sphaira.nro
              echo "Bundled official Sphaira at switch/sphaira.nro"
            else
              echo "No sphaira.nro found in official archive"
            fi
          else
            echo "Sphaira unavailable; see official download in README"
          fi
      - name: Validate Switch NRO binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nro=Path("output/switch/WookReader/WookReader.nro")
          assert nro.stat().st_size > 1000000
          with nro.open("rb") as f:
              f.seek(16)
              assert f.read(4) == b"NRO0"
          print("Valid WookReader NRO",nro.stat().st_size)
          PY
      - name: Upload ready-to-copy package
        uses: actions/upload-artifact@v4
        with:
          name: WookReader_RU2_Switch_READY
          path: output/
          if-no-files-found: error
